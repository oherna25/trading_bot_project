name: pytest

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest ruff mypy
      - run: python -m pip install .
      - run: marketwingman --help
      - run: marketwingman-demo --help
      - run: marketwingman-session --help
      - run: python -m pytest tests/ -q
      - run: python -m ruff check bot tests run_app.py run_session.py
      - run: python -m mypy bot run_app.py run_session.py
