model_name: trading-bot-dashboard
python_version: py311
requirements: []
resources:
  cpu: "1"
  memory: 2Gi
base_image:
  image: python:3.11-slim
environment_variables:
  # Set after the first push to the deployment sync root, then push again:
  #   https://model-<MODEL_ID>.api.baseten.co/environments/production/sync
  DASHBOARD_BASE_URL: SET_AFTER_PUSH_TO_SYNC_ROOT
secrets:
  TRADIER_ACCESS_TOKEN: null
  TRADIER_ACCOUNT_ID: null
  APCA_API_KEY_ID: null
  APCA_API_SECRET_KEY: null
  FINNHUB_API_KEY: null
  MARKETDATA_API_KEY: null
  META_MODEL_API_KEY: null
docker_server:
  start_command: python /app/run_app.py --store-dir /app/data/trading-bot --host 0.0.0.0 --port 8000
  server_port: 8000
  predict_endpoint: /chat
  readiness_endpoint: /healthz
  liveness_endpoint: /healthz
