# Full app (default), zero-key demo (profile: demo), one-shot session (profile: jobs).
#   docker compose up -d app
#   docker compose --profile demo up demo
#   docker compose --profile jobs run --rm session
# Keys come from .env when present (copy .env.example); no key is required.
# All mutable state lives in the named volumes below, never in the image.

services:
  app:
    build: .
    image: marketwingman
    command:
      - marketwingman
      - --underlying
      - ${UNDERLYING:-SPY}
      - --store-dir
      - /data/trading-bot
      - --host
      - "0.0.0.0"
      - --refresh-seconds
      - ${REFRESH_SECONDS:-900}
      - --session-schedule
      - ${SESSION_SCHEDULE:-}
    environment:
      PORT: "8000"
      LEDGER_DIR: /data/ledger
      TZ: ${TZ:-UTC}
    env_file:
      - path: .env
        required: false
    ports:
      - "${HOST_PORT:-8000}:8000"
    volumes:
      - app-data:/data
    restart: unless-stopped

  demo:
    build: .
    image: marketwingman
    profiles: ["demo"]
    environment:
      PORT: "8000"
      TZ: ${TZ:-UTC}
    env_file:
      - path: .env
        required: false
    ports:
      - "${HOST_PORT:-8000}:8000"
    volumes:
      - demo-data:/data
    restart: unless-stopped

  session:
    build: .
    image: marketwingman
    profiles: ["jobs"]
    command:
      - marketwingman-session
      - --underlying
      - ${UNDERLYING:-SPY}
      - --store-dir
      - /data/trading-bot
    environment:
      LEDGER_DIR: /data/ledger
      TZ: ${TZ:-UTC}
    env_file:
      - path: .env
        required: false
    volumes:
      - app-data:/data

volumes:
  app-data:
  demo-data:
